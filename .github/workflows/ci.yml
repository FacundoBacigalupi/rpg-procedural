name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detectar proyecto Node
        id: node
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "Sin package.json todavía: se saltean los checks."; fi
      - uses: actions/setup-node@v7
        if: steps.node.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.node.outputs.present == 'true'
        run: npm ci
      - if: steps.node.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.node.outputs.present == 'true'
        run: npm run lint
      - if: steps.node.outputs.present == 'true'
        run: npm test

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Revisión de dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: npm audit
        run: |
          if [ -f package-lock.json ]; then npm audit --audit-level=high; else echo "Sin package-lock.json todavía."; fi
