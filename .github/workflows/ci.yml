name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint y tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # El usuario juega en Windows; Linux confirma que el determinismo no depende de la plataforma.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # Check obligatorio del ruleset de main: agrupa la matriz bajo el nombre de siempre.
  check-summary:
    name: Typecheck, lint y tests
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = "success"

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Revisión de dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: npm audit
        run: npm audit --audit-level=high
